<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="container">
    <h1>Student Management System</h1>
    <p>Welcome to Student Portal</p>

    <h2>Add Student</h2>

    <form action="/add_student" method="post">

        <input type="text"
               name="student_name"
               placeholder="Student Name"
               required>
        <br><br>

        <input type="number"
               name="roll"
               placeholder="Roll Number"
               required>
        <br><br>

        <input type="number"
               name="marks"
               placeholder="Marks"
               min="0"
               max="100"
               required>
        <br><br>

        <button type="submit">Save Student</button>

    </form>

    <br><br>

    <a href="/students">
        <button type="button">View Students</button>
    </a>
<br><br>

<a href="/search">
    <button type="button">Search Student</button>
</a>
<br><br>
<a href="/dashboard">
    <button type="button">
        📊 Student Dashboard
    </button>
</a>
</div>
</body>
</html>
